---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <!-- Link to your custom Simplex overrides -->
    <link rel="stylesheet" href="{{ '/assets/css/simplex-overrides.css' | relative_url }}">

    <style>
      /* Fluid container */
      .container {
        width: 80%;
        max-width: 100%;
        margin: 0 auto;
        padding: 0 20px; /* default left and right padding */
      }

      /* For smaller screens (e.g., phones), add extra space on the right */
      @media (max-width: 576px) {
        .container {
          padding-right: 30px;  /* Increase right padding for mobile */
        }
      }
    </style>    
  </head>
  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <!-- Wrap the content in the container -->
    <div class="container">
      {{ content }}
    </div>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
