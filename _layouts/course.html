---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <!-- Inline CSS for table styling -->
    <style>
      /* Ensure the table fills its container and collapses borders */
      .container table.table {
        width: 100%;
        border-collapse: collapse;
        border: none;  /* Remove any outer table borders */
      }
    
      /* Remove all borders from cells and add only a bottom border */
      .container table.table th,
      .container table.table td {
        padding: 0.50rem;
        text-align: left;
        border: none;  /* Clear any existing borders */
        border-bottom: 1px solid #bfbfbfdd;  /* Only bottom border for each cell */
      }
    
      /* Customize header: no other borders plus a thicker, darker top/bottom border */
      .container table.table thead th {
        border: none;
        border-bottom: 1px solid #000000;
        border-top: 1px solid #000000;
      }
      
    </style>
    
    <style>
      /* Fluid container */
      .container {
        width: 80%;
        max-width: 100%;
        margin: 0 auto;
        padding: 0 20px; /* default left and right padding */
      }

      /* For smaller screens (e.g., phones), add extra space on the right */
      @media (max-width: 576px) {
        .container {
          padding-right: 30px;  /* Increase right padding for mobile */
        }
      }
    </style>
  </head>
  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <!-- Wrap the content in the container -->
    <div class="container">
      {{ content }}
    </div>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
