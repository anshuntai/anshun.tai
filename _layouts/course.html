---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <!-- Inline CSS for table styling -->
    <style>
      /* Table style: full width and collapsed borders */
      .container table.table,
      .container table.table-striped,
      .container table.table-hover {
        width: 100%;
        border-collapse: collapse;
      }

      /* Style table header and cell padding and borders */
      .container table.table th,
      .container table.table td {
        padding: 0.75rem;
        text-align: left;
        /* Remove any top border and add light bottom border for each row */
        border-top: none;
        border-bottom: 1px solid #ddd;
      }

      /* Header row: thicker and darker bottom border */
      .container table.table thead th {
        border-bottom: 3px solid #444;
      }

      /* Striped row effect: odd rows get a subtle background */
      .container table.table tbody tr:nth-of-type(odd) {
        background-color: rgba(0, 0, 0, 0.05);
      }

      /* Hover effect: change row background color on hover */
      .container table.table tbody tr:hover {
        background-color: rgba(0, 0, 0, 0.075);
      }
    </style>

    <style>
      /* Fluid container */
      .container {
        width: 80%;
        max-width: 100%;
        margin: 0 auto;
        padding: 0 20px; /* default left and right padding */
      }

      /* For smaller screens (e.g., phones), add extra space on the right */
      @media (max-width: 576px) {
        .container {
          padding-right: 30px;  /* Increase right padding for mobile */
        }
      }
    </style>
  </head>
  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <!-- Wrap the content in the container -->
    <div class="container">
      {{ content }}
    </div>

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
